<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aphelios · 我的待办</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="dashboard"><div class="demo-toolbar"><div class="department-control"><label for="demoDepartment">演示部门</label><select id="demoDepartment"><option value="">使用 Cookie</option><option value="公共产品开发与IT装备部">公共产品开发与IT装备部</option><option value="MAE-CN产品部">MAE-CN产品部</option></select></div></div><section class="panel todo"><header class="heading"><div class="title"><span class="title-icon">▤</span><h1>我的待办</h1><span class="count">12</span></div><nav class="tabs" aria-label="按类型筛选"></nav><div class="tools"><button class="icon-button" id="filterButton" title="状态筛选" aria-label="状态筛选">⚲</button><button class="icon-button" id="settingsButton" title="显示设置" aria-label="显示设置">☷</button><button class="icon-button" id="moreButton" title="更多" aria-label="更多">•••</button></div></header><div class="department-context"><div><span class="context-label">当前部门</span><strong id="departmentName">未识别</strong><span id="departmentHint" class="context-hint"></span></div><div class="sources"><span class="context-label">来源系统</span><span id="sourceSystems">暂无配置</span></div></div><div class="filter-bar" id="filterBar" hidden><label>状态 <select id="statusFilter"><option value="全部">全部</option><option>待处理</option><option>执行中</option><option>待审核</option><option>已完成</option><option>失败</option></select></label><label>优先级 <select id="priorityFilter"><option value="全部">全部</option><option>高</option><option>中</option><option>低</option></select></label><button id="resetFilters">重置筛选</button></div><div class="rows" id="rows"></div><footer class="footer"><span id="selectedCount"></span><div class="pagination"><button id="prev" aria-label="上一页">‹</button><span id="pageInfo"></span><button id="next" aria-label="下一页">›</button></div><button class="primary batch" id="batch">ϟ&nbsp; 批量交给 Agent <span>↗</span></button></footer></section><section class="panel tracking"><header class="tracking-header"><div class="title"><span class="title-icon pulse">⌁</span><h2>Agent 任务追踪</h2></div><button class="link" id="agentSpace">前往 AgentSpace ↗</button></header><div class="tracking-body"><div class="overview"><div class="gauge"><svg viewBox="0 0 200 120" aria-hidden="true"><defs><linearGradient id="gradient"><stop stop-color="#064dfb"/><stop offset="1" stop-color="#8950ff"/></linearGradient></defs><path d="M 15 105 A 85 85 0 0 1 185 105" class="gauge-track"/><path d="M 15 105 A 85 85 0 0 1 174 63" class="gauge-progress"/></svg><div class="gauge-label"><strong id="totalTasks">19</strong><span>运行中任务</span></div></div><ul class="legend" id="legend"></ul></div><div class="activity"><h3><span>◷</span> 最近活动</h3><div id="activityRows"></div></div></div></section></main><div class="toast" id="toast" role="status"></div><dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭">×</button></div><div id="dialogContent"></div><div class="dialog-actions"><button id="cancelDialog">取消</button><button class="primary" id="confirmDialog">确认</button></div></dialog><dialog id="planDialog" class="plan-dialog"><div class="plan-head"><div><span class="plan-kicker">AGENTSPACE · 任务派发</span><h2>选择执行方案</h2><p>选择本次需要完成的工作，系统将触发对应的 Workflow / Agent</p></div><button id="closePlan" aria-label="关闭">×</button></div><div class="plan-object"><span class="plan-object-icon">▤</span><div><small>工作对象</small><strong id="planObject"></strong></div><span class="plan-object-count" id="planCount"></span></div><div class="plan-section-title"><strong>选择本次要完成的工作</strong><span>请选择一个执行方案</span></div><div class="plan-options" id="planOptions"></div><div class="plan-note">ⓘ&nbsp; 下发后，可在 Agent 任务追踪中查看执行状态与结果。</div><div class="plan-footer"><button id="cancelPlan">取消</button><button class="primary" id="submitPlan" disabled>确认下发 <span>→</span></button></div></dialog><script src="app.js"></script></body></html>
